<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta name="color-scheme" content="dark" />
<meta name="format-detection" content="telephone=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<title>Kabin Paneli</title>
<link rel="apple-touch-icon" sizes="180x180" href="icon.png?v=2" />
<link rel="icon" type="image/png" href="icon.png?v=2" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --vh:1vh;--vw:1vw;
  --px:max(env(safe-area-inset-left),clamp(18px,calc(3*var(--vw)),40px));
  --bg:#000;
  --card:#1c1c1e;
  --line:rgba(255,255,255,.09);
  --acc:229,72,77;
  --red:rgb(var(--acc));
  --red-glow:rgba(var(--acc),.55);
  --tx:#f5f5f7;
  --tx2:rgba(245,245,247,.62);
  --tx3:rgba(245,245,247,.38);
}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100vw;height:100vh;height:100dvh;overflow:hidden;background:#000;color:var(--tx);touch-action:manipulation;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;font-synthesis:none;
  font-family:'Montserrat',-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;
  font-feature-settings:'tnum' 1;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

.bg-photo{position:fixed;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat;opacity:.3;z-index:0;transition:opacity .8s}
.bg-vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,.25) 0%,rgba(0,0,0,.9) 70%,#000 100%)}

.screen{position:relative;z-index:2;width:100%;height:100%;display:flex;flex-direction:column;justify-content:space-between;
  padding:max(env(safe-area-inset-top),clamp(4px,calc(.8*var(--vh)),8px)) 0 max(env(safe-area-inset-bottom),clamp(6px,calc(1.2*var(--vh)),12px)) 0}

/* ÜST BAR — tarih ve saat aynı boyda, aynı hizada, yukarıya dayalı */
.top-bar{display:flex;align-items:flex-start;justify-content:center;position:relative;height:clamp(34px,calc(8*var(--vh)),58px);padding:0 var(--px);flex-shrink:0}
.top-center{height:100%;display:inline-flex;align-items:center;gap:clamp(4px,calc(.8*var(--vw)),10px)}
.loc{height:100%;display:inline-flex;align-items:center;gap:clamp(7px,calc(1.2*var(--vh)),10px);padding:0 6px;cursor:pointer}
.pin{width:clamp(18px,calc(3.2*var(--vh)),24px);height:clamp(18px,calc(3.2*var(--vh)),24px);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.loc-text{font-size:clamp(13px,calc(2.5*var(--vh)),19px);font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--tx);
  max-width:calc(24*var(--vw));overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-btn{width:clamp(28px,calc(5.2*var(--vh)),38px);height:clamp(28px,calc(5.2*var(--vh)),38px);border-radius:50%;
  border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:var(--tx2);
  display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:border-color .2s,color .2s,background .2s}
.nav-btn:active{transform:scale(.92)}
.nav-btn.on{border-color:rgba(var(--acc),.65);background:rgba(var(--acc),.16);color:var(--red);box-shadow:0 0 12px rgba(var(--acc),.3)}

.date-wrap{position:absolute;left:var(--px);top:0;height:100%;display:flex;align-items:center;gap:clamp(8px,calc(1.6*var(--vh)),14px);color:var(--clk,var(--tx))}
.date-wrap b{font-size:clamp(32px,calc(7.8*var(--vh)),58px);font-weight:800;letter-spacing:-.05em;line-height:1}
.date-r{display:flex;flex-direction:column;gap:clamp(3px,calc(.7*var(--vh)),6px)}
.date-r span{font-size:clamp(7.5px,calc(1.4*var(--vh)),10.5px);font-weight:600;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap}
.date-r u{display:block;height:1px;background:currentColor;opacity:.75}
.clock{position:absolute;right:var(--px);top:0;height:100%;display:flex;align-items:center;font-size:clamp(32px,calc(7.8*var(--vh)),58px);font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;color:var(--clk,var(--tx));padding-left:18px;cursor:pointer;animation:breathe 5s ease-in-out infinite}
@keyframes breathe{0%,100%{text-shadow:0 0 6px rgba(var(--acc),.16),0 0 16px rgba(var(--acc),.08)}50%{text-shadow:0 0 12px rgba(var(--acc),.55),0 0 30px rgba(var(--acc),.28)}}
@keyframes pulse{50%{opacity:.35;transform:scale(.8)}}

/* ORTA — Sol: Hava + Navigasyon | Orta: Harita (tam ortada) | Sağ: Pusula */
.middle{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);align-items:center;gap:clamp(10px,calc(1.8*var(--vw)),26px);flex:1;min-height:0;padding:clamp(4px,calc(1*var(--vh)),10px) var(--px)}
.left{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:clamp(4px,calc(1*var(--vh)),10px);min-width:0}

.temp-row{display:inline-flex;align-items:center;gap:clamp(8px,calc(1.6*var(--vh)),14px);width:fit-content}
.temp{display:flex;line-height:.9}
.temp b{font-size:clamp(46px,calc(10.6*var(--vh)),84px);font-weight:700;letter-spacing:-.05em}
.temp sup{font-size:clamp(14px,calc(2.6*var(--vh)),22px);font-weight:500;color:var(--tx2);margin:clamp(6px,calc(1.2*var(--vh)),12px) 0 0 3px}

.wx-mini{height:clamp(44px,calc(10.2*var(--vh)),78px);width:clamp(50px,calc(11.6*var(--vh)),90px);display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;--glow:rgba(243,178,59,.10)}
.wx-mini::before{content:'';position:absolute;inset:-20%;background:radial-gradient(closest-side,var(--glow),transparent);pointer-events:none}
.wx-mini svg{position:relative;height:100%;width:auto;max-width:100%;display:block;overflow:visible;transition:transform .18s}

.cond{font-size:clamp(10px,calc(1.8*var(--vh)),14px);font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:rgba(245,245,247,.9)}
.metrics{display:grid;grid-template-columns:auto auto;gap:clamp(4px,calc(1*var(--vh)),9px) clamp(14px,calc(2*var(--vw)),26px);margin-top:clamp(2px,calc(.8*var(--vh)),8px);justify-content:start}

/* NAVİGASYON METRİKLERİ + SAĞINDA YÖN & KALAN METRE */
.nav-row{display:flex;align-items:center;gap:clamp(8px,calc(1.2*var(--vw)),14px);margin-top:clamp(2px,calc(.5*var(--vh)),5px);max-width:100%}
.nav-metrics{display:flex;flex-direction:column;gap:clamp(4px,calc(1*var(--vh)),9px);min-width:0}
.nav-metrics.on .metric b{color:var(--clk,var(--tx))}
.metric{display:flex;flex-direction:column;gap:2px}
.metric span{display:inline-flex;align-items:center;gap:4px;font-size:clamp(7px,calc(1.15*var(--vh)),9px);color:var(--tx3);font-weight:600;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
.metric b{font-size:clamp(12px,calc(1.9*var(--vh)),15px);font-weight:600;letter-spacing:.02em;font-variant-numeric:tabular-nums;white-space:nowrap}

.nav-hud{display:none;align-items:center;gap:clamp(5px,calc(.75*var(--vw)),9px);
  padding-left:clamp(8px,calc(1.2*var(--vw)),14px);border-left:1px solid rgba(255,255,255,.12);
  cursor:pointer;flex-shrink:0;transition:opacity .25s,transform .15s}
.nav-hud:active{transform:scale(.95)}
.nav-hud.on{display:inline-flex}
.nav-ico{width:clamp(21px,calc(3.7*var(--vh)),28px);height:clamp(21px,calc(3.7*var(--vh)),28px);
  color:var(--red);display:flex;align-items:center;justify-content:center;flex-shrink:0;
  filter:drop-shadow(0 0 6px rgba(var(--acc),.45))}
.nav-ico svg{width:100%;height:100%}
.nav-dist{font-size:clamp(14px,calc(2.35*var(--vh)),18.5px);font-weight:700;letter-spacing:.02em;color:var(--clk,var(--tx));font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.1}

/* HARİTA — canvas mutlak konumlu: grid yüksekliğini bozmaz */
.road-wrap{position:relative;z-index:1;width:auto;justify-self:stretch;align-self:stretch;min-height:0;overflow:hidden;margin:calc(-4.5*var(--vh)) calc(-4*var(--vw)) 0;pointer-events:none}
.left,.right{position:relative;z-index:2}
.screen>header.top-bar{z-index:3}
.road-cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.road-hud{position:absolute;left:calc(4*var(--vw) + 4px);bottom:4px;display:flex;flex-direction:column;gap:2px;pointer-events:none;z-index:3}
.road-badge{font-size:clamp(8px,calc(1.3*var(--vh)),10px);font-weight:600;letter-spacing:.16em;color:var(--tx3);text-transform:uppercase}
.road-status{max-width:calc(24*var(--vw));line-height:1.5;font-size:clamp(7px,calc(1.1*var(--vh)),8.5px);font-weight:600;letter-spacing:.14em;color:rgba(245,245,247,.28);text-transform:uppercase}

.zoom-hit{pointer-events:auto;padding:14px 22px 8px 8px;margin:-14px -22px -8px -8px;cursor:pointer;display:block}
.veh-hit{position:absolute;left:50%;top:78%;transform:translate(-50%,-50%);width:clamp(48px,calc(10*var(--vh)),76px);height:clamp(66px,calc(14*var(--vh)),104px);pointer-events:auto;cursor:pointer;z-index:4}

/* PUSULA — sol blokla aynı dikey ortada */
.right{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;align-self:center;gap:clamp(6px,calc(1.2*var(--vh)),10px);min-width:0}
.compass{height:clamp(110px,calc(33*var(--vh)),200px);aspect-ratio:1.2;border-radius:2px;background:#000;display:grid;grid-template-columns:1fr auto;
  padding:clamp(10px,calc(2.2*var(--vh)),18px) clamp(10px,calc(2*var(--vh)),16px) clamp(10px,calc(2.2*var(--vh)),18px) clamp(8px,calc(1.6*var(--vh)),14px);cursor:pointer;flex-shrink:0}
.c-left{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;min-width:0;gap:2px}
.alt{font-size:clamp(24px,calc(6.8*var(--vh)),54px);font-weight:700;letter-spacing:-.05em;line-height:1}
.alt-l{font-size:clamp(6.5px,calc(1.25*var(--vh)),9.5px);font-weight:600;letter-spacing:.16em;text-transform:uppercase;line-height:1.4;color:var(--tx2)}
.tape{position:relative;width:clamp(54px,calc(13*var(--vh)),96px)}
.t-in{position:absolute;inset:3px 0}
.ticks{position:absolute;left:0;top:0;bottom:0;width:clamp(22px,calc(5.4*var(--vh)),42px)}
.ticks i{position:absolute;left:0;right:0;height:1px;background:rgba(245,245,247,.9)}
.letter{position:absolute;right:0;font-size:clamp(14px,calc(3.6*var(--vh)),28px);font-weight:700;line-height:1;transform:translateY(-50%)}
.letter.top{top:0}.letter.bot{top:100%}
.mk{position:absolute;left:-6px;width:clamp(32px,calc(7.6*var(--vh)),56px);height:clamp(2.5px,calc(.55*var(--vh)),4.5px);border-radius:3px;background:var(--red);box-shadow:0 0 8px var(--red-glow);transform:translateY(-50%)}
.mk-l{position:absolute;right:0;font-size:clamp(10px,calc(2.3*var(--vh)),16px);font-weight:600;transform:translateY(-50%)}
.live-coords{display:flex;align-items:center;gap:clamp(7px,calc(1.2*var(--vh)),11px);font-size:clamp(8px,calc(1.5*var(--vh)),11px);font-weight:600;letter-spacing:.1em;white-space:nowrap;color:var(--tx)}
.live-coords i{width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red);animation:pulse 2s infinite}

/* SAATLİK */
.hourly{width:100%;display:flex;align-items:center;min-height:clamp(74px,calc(14.5*var(--vh)),102px);margin-bottom:clamp(2px,calc(.6*var(--vh)),6px);padding:0 var(--px);flex-shrink:0}
.wave{width:100%;display:flex;flex-direction:column;justify-content:space-between;gap:2px}
.w-row{width:100%;display:grid;grid-template-columns:repeat(8,1fr);text-align:center}
.h-t{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:clamp(11.5px,calc(1.8*var(--vh)),14px);font-weight:500;color:var(--tx2)}
.h-t.on{color:var(--tx);font-weight:700}
.h-dot{width:5px;height:5px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red);opacity:0}.h-t.on .h-dot{opacity:1}
.w-line{width:100%;height:clamp(16px,calc(3.2*var(--vh)),26px)}.w-line svg{width:100%;height:100%;display:block;overflow:visible}
.h-h{display:flex;flex-direction:column;align-items:center;gap:2px}
.h-h span{font-size:clamp(8.5px,calc(1.25*var(--vh)),10.5px);font-weight:600;letter-spacing:.08em;color:var(--tx3);padding:1.5px 7px;border-radius:6px}
.h-h.on span{background:rgba(255,255,255,.09);color:var(--tx)}
.h-p{font-size:clamp(9px,calc(1.4*var(--vh)),11px);color:#7fb7ff;font-weight:600;display:flex;align-items:center;gap:3px}
.h-p.lo{opacity:.4}.h-p.hi{color:var(--red);text-shadow:0 0 8px var(--red-glow)}

/* RADYO — şarkı yazısı aşağıda, ekolayzır alçak */
.dock{width:100%;display:flex;align-items:center;justify-content:center;flex-shrink:0;height:clamp(54px,calc(11*var(--vh)),72px)}
.player{width:100%;height:100%;background:#000;display:flex;flex-direction:column;justify-content:flex-end;gap:clamp(1px,calc(.4*var(--vh)),4px);padding:0 var(--px) 0 var(--px)}
.p-top{display:flex;align-items:center;justify-content:space-between;gap:14px;min-width:0}
.p-meta{flex:1;min-width:0;font-size:clamp(12px,calc(2*var(--vh)),14.5px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--clk,var(--tx))}
.p-song{color:var(--clk,var(--tx));font-weight:600;letter-spacing:.01em}
.p-sep{color:var(--clk,var(--tx));opacity:.5;font-weight:400;margin:0 7px}
.p-chan{color:var(--clk,var(--tx));opacity:.75;font-weight:500;font-size:.82em;letter-spacing:.14em;text-transform:uppercase}
.p-ctrls{display:flex;align-items:center;gap:clamp(10px,calc(1.6*var(--vw)),18px);flex-shrink:0}
.play{width:clamp(24px,calc(4.2*var(--vh)),32px);height:clamp(24px,calc(4.2*var(--vh)),32px);color:var(--play,#d97724);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .12s,filter .15s}
.play:active{transform:scale(.9);filter:brightness(1.2)}
.play svg{width:100%;height:100%}
.nxt{width:clamp(20px,calc(3.4*var(--vh)),26px);height:clamp(20px,calc(3.4*var(--vh)),26px);color:rgba(242,242,244,.65);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .12s,color .15s}
.nxt:active{transform:scale(.9);color:#fff}
.nxt svg{width:100%;height:100%}
.eq{display:block;width:100%;height:clamp(16px,calc(3.4*var(--vh)),26px)}

/* MODAL */
.modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.8);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.panel{width:100%;max-width:400px;max-height:92%;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.search{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--tx);font-size:14px;outline:none}
.search:focus{border-color:rgba(var(--acc),.6)}
.res{display:flex;flex-direction:column;gap:6px;max-height:190px;overflow-y:auto}
.opt{padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.05);font-size:13px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.opt:active{background:rgba(var(--acc),.25)}
.opt-top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:600;color:var(--tx)}
.opt-dist{font-size:11px;font-weight:600;color:var(--red);flex-shrink:0}
.opt-sub{font-size:11px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input[type=file]{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.screen>header,.screen>main,.screen>section,.screen>footer{position:relative;z-index:2}
.toast{position:absolute;left:50%;top:calc(12*var(--vh));transform:translateX(-50%);background:rgba(255,255,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:7px 16px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
.fx-cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.road-wrap,.right,.left,.hourly,.date-wrap,.clock{transition:opacity 1.2s}
.screen.rest .road-wrap,.screen.rest .right,.screen.rest .left,.screen.rest .hourly,.screen.rest .date-wrap,.screen.rest .clock{opacity:0;pointer-events:none}
.screen.rest .zoom-hit,.screen.rest .veh-hit,.screen.rest .nav-hud{pointer-events:none}
#restBox{position:absolute;left:0;right:0;top:46%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:clamp(6px,calc(2*var(--vh)),16px);opacity:0;pointer-events:none;transition:opacity 1.2s;z-index:3;cursor:pointer}
.screen.rest #restBox{opacity:1;pointer-events:auto}
.rest-clock{font-size:clamp(70px,calc(34*var(--vh)),240px);font-weight:300;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;color:var(--clk,var(--tx));animation:breathe 6s ease-in-out infinite}
.rest-date{font-size:clamp(10px,calc(2.3*var(--vh)),17px);font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--tx2)}
.rest-wx{display:flex;align-items:center;gap:clamp(10px,calc(2*var(--vh)),18px);margin-top:clamp(4px,calc(1.4*var(--vh)),12px)}
.rest-ico{height:clamp(34px,calc(8*var(--vh)),60px);width:clamp(40px,calc(9.4*var(--vh)),70px);display:flex;align-items:center;justify-content:center}
.rest-ico svg{height:100%;width:auto;display:block;overflow:visible}
.rest-wx b{font-size:clamp(22px,calc(5*var(--vh)),38px);font-weight:600;letter-spacing:-.02em}
.rest-wx span{font-size:clamp(9px,calc(1.8*var(--vh)),13px);font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--tx2)}
.ahead-chip{position:absolute;left:50%;top:calc(4.5*var(--vh) + 8px);transform:translateX(-50%) translateY(-6px);display:flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;background:rgba(0,0,0,.55);border:1px solid rgba(255,176,0,.55);color:#ffcf66;font-size:clamp(8px,calc(1.35*var(--vh)),10.5px);font-weight:600;letter-spacing:.14em;white-space:nowrap;opacity:0;transition:opacity .6s,transform .6s,top .4s;z-index:5;pointer-events:none}
.ahead-chip.on{opacity:1;transform:translateX(-50%)}
#dimLayer{position:fixed;inset:0;z-index:40;background:#000;opacity:0;pointer-events:none;transition:opacity 1.2s}
</style>
</head>
<body>

<input type="file" id="mp3Input" accept="audio/*" multiple />
<input type="file" id="photoInput" accept="image/*" multiple />
<audio id="audioTag" preload="none"></audio>
<span id="gpsText" hidden></span>
<div id="barTrack" hidden><i id="barFill"></i></div>

<div class="screen">
<div id="bgPhoto" class="bg-photo"></div>
<div class="bg-vignette"></div>
<canvas class="fx-cv" id="fxCanvas"></canvas>
  <header class="top-bar">
    <div class="date-wrap">
      <b id="bigDay">--</b>
      <div class="date-r"><span id="dayLine"></span><u></u><span id="monthLine"></span></div>
    </div>
    <div class="clock" id="clockT">--:--</div>
    <div class="top-center">
      <div class="loc" onclick="openCity()">
        <span class="pin"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="1.9" stroke-linecap="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></span>

/* ---------- HAVA DURUMU ÇİZGİ İKONLARI ---------- */
const C_CLOSED = "M 74 128 A 26 26 0 1 1 80.4 76.8 A 38 38 0 0 1 156.0 80.1 A 24 24 0 1 1 154 128 Z";
const C_OPEN   = "M 92 128 L 74 128 A 26 26 0 1 1 80.4 76.8 A 38 38 0 0 1 156.0 80.1 A 24 24 0 1 1 154 128 L 136 128";
const cloudClosed = (tr="") => `<path d="${C_CLOSED}" fill="#000" stroke="#f5f5f7" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" transform="${tr}"/>`;
const cloudOpen   = (tr="") => `<g transform="${tr}"><path d="${C_CLOSED}" fill="#000" stroke="none"/><path d="${C_OPEN}" fill="none" stroke="#f5f5f7" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/></g>`;

function sunLines(cx, cy, r, r1, r2, sw=6.5){
  let rays = "";
  for (let i=0; i<8; i++){
    const a = i * Math.PI / 4, ca = Math.cos(a), sa = Math.sin(a);
    rays += `<line x1="${(cx+r1*ca).toFixed(1)}" y1="${(cy+r1*sa).toFixed(1)}" x2="${(cx+r2*ca).toFixed(1)}" y2="${(cy+r2*sa).toFixed(1)}"/>`;
  }
  return `<g stroke="#f3b23b" stroke-width="${sw}" stroke-linecap="round" fill="none"><circle cx="${cx}" cy="${cy}" r="${r}"/>${rays}</g>`;
}
function moonLines(cx, cy, s=1){
  return `<g transform="translate(${cx},${cy}) scale(${s})" stroke="#f3b23b" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="#000">`+
    `<path d="M 6 -27.3 A 28 28 0 1 0 27.3 6 A 22 22 0 0 1 6 -27.3 Z"/>`+
    `<path d="M 16 -21 v 10 M 11 -16 h 10" stroke-width="4.5"/></g>`;
}
function bigSnowflake(cx, cy){
  let g = "";
  for (let i=0; i<6; i++){
    g += `<g transform="rotate(${i*60} ${cx} ${cy})">`+
         `<line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy-46}"/>`+
         `<polyline points="${cx-11},${cy-35} ${cx},${cy-25} ${cx+11},${cy-35}"/>`+
         `</g>`;
  }
  return `<g stroke="#63a7cf" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none">${g}</g>`;
}

const GLOW = {
  sun:'rgba(243,178,59,.11)', msunny:'rgba(243,178,59,.09)', pcloud:'rgba(243,178,59,.07)',
  cloud:'rgba(245,245,247,.06)', fog:'rgba(245,245,247,.06)',
  crain:'rgba(99,167,207,.09)', rain:'rgba(99,167,207,.10)', sleet:'rgba(99,167,207,.10)',
  csnow:'rgba(99,167,207,.10)', snow:'rgba(99,167,207,.11)',
  ctstorm:'rgba(243,178,59,.10)', tstorm:'rgba(243,178,59,.10)'
};

function bigArt(t, night){
  const bolt = `<polyline points="122,102 106,129 122,129 108,156" fill="none" stroke="#f3b23b" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  const b = {
    sun: night ? moonLines(110, 95, 1.1) : sunLines(110, 95, 24, 35, 47, 6.5),
    msunny: (night ? moonLines(134, 72, 0.85) : sunLines(134, 72, 22, 32, 42, 6)) + cloudClosed("translate(-12 22) scale(.76)"),
    pcloud: (night ? moonLines(154, 66, 0.72) : sunLines(154, 66, 17, 25, 33, 5.5)) + cloudClosed("translate(-4 10)"),
    cloud: cloudClosed("translate(-4 8)"),
    fog: `<g stroke="#f5f5f7" stroke-width="6.5" stroke-linecap="round" fill="none">`+
         `<path d="M 62 74 Q 86 64 110 74 T 158 74"/>`+
         `<path d="M 62 96 Q 86 86 110 96 T 158 96"/>`+
         `<path d="M 62 118 Q 86 108 110 118 T 158 118"/></g>`,
    crain: cloudOpen("translate(-4 -4)") +
           `<g stroke="#63a7cf" stroke-width="5.8" stroke-linecap="round">`+
           `<line x1="94" y1="118" x2="89" y2="129"/><line x1="112" y1="118" x2="107" y2="129"/><line x1="130" y1="118" x2="125" y2="129"/>`+
           `<line x1="88" y1="139" x2="83" y2="150"/><line x1="106" y1="139" x2="101" y2="150"/><line x1="124" y1="139" x2="119" y2="150"/></g>`,
    rain: cloudOpen("translate(-4 -4)") +
          `<g stroke="#63a7cf" stroke-width="6" stroke-linecap="round">`+
          `<line x1="96" y1="116" x2="82" y2="152"/><line x1="114" y1="116" x2="100" y2="152"/><line x1="132" y1="116" x2="118" y2="152"/></g>`,
    sleet: cloudOpen("translate(-4 -4)") +
           `<g stroke="#63a7cf" stroke-width="5.8" stroke-linecap="round">`+
           `<line x1="96" y1="116" x2="87" y2="138"/><line x1="114" y1="116" x2="105" y2="138"/><line x1="132" y1="116" x2="123" y2="138"/></g>`+
           `<g fill="#63a7cf"><circle cx="83" cy="149" r="3.3"/><circle cx="101" cy="149" r="3.3"/><circle cx="119" cy="149" r="3.3"/></g>`,
    csnow: cloudOpen("translate(-4 -4)") +
           `<g stroke="#63a7cf" stroke-width="5.5" stroke-linecap="round" transform="translate(110 128)">`+
           `<line x1="0" y1="-16" x2="0" y2="16"/><line x1="-13.9" y1="-8" x2="13.9" y2="8"/><line x1="-13.9" y1="8" x2="13.9" y2="-8"/></g>`,
    snow: bigSnowflake(110, 95),
    ctstorm: cloudOpen("translate(-4 -4)") + bolt,
    tstorm: cloudOpen("translate(-4 -4)") + bolt +
            `<g stroke="#63a7cf" stroke-width="5.5" stroke-linecap="round">`+
            `<line x1="86" y1="128" x2="81" y2="140"/><line x1="98" y1="128" x2="93" y2="140"/>`+
            `<line x1="130" y1="128" x2="125" y2="140"/><line x1="142" y1="128" x2="137" y2="140"/></g>`
  }[t] || cloudClosed("translate(-4 8)");
  return `<svg viewBox="0 0 220 185" width="220" height="185">${b}</svg>`;
}

function setArt(t, night){
  const a = $('art');
  a.innerHTML = bigArt(t, night);
  a.style.setProperty('--glow', night && t==='sun' ? 'rgba(243,178,59,.08)' : (GLOW[t] || GLOW.cloud));

function wx(code){
  if (code===0) return {label:"Açık ve güneşli", type:"sun"};
  if (code===1) return {label:"Az bulutlu", type:"msunny"};
  if (code===2) return {label:"Parçalı bulutlu", type:"pcloud"};
  if (code===3) return {label:"Çok bulutlu", type:"cloud"};
  if ([45,48].includes(code)) return {label:"Sisli", type:"fog"};
  if ([51,53,55,61,80].includes(code)) return {label:"Hafif yağmurlu", type:"crain"};
  if ([63,65,81,82].includes(code)) return {label:"Yağmurlu", type:"rain"};
  if ([56,57,66,67].includes(code)) return {label:"Sulu kar", type:"sleet"};
  if ([71,77,85].includes(code)) return {label:"Hafif kar yağışlı", type:"csnow"};
  if ([73,75,86].includes(code)) return {label:"Kar yağışlı", type:"snow"};
  if (code===95) return {label:"Gök gürültülü fırtına", type:"ctstorm"};
  if ([96,99].includes(code)) return {label:"Fırtına ve sağanak", type:"tstorm"};
  return {label:"Bulutlu", type:"cloud"};
}

/* ---------- HARİTA (kuşbakışı, çevrimdışı destekli) ---------- */
const roadCv = $('roadCanvas'), rctx = roadCv.getContext('2d');
const DPR = Math.min(3, window.devicePixelRatio || 1);
const ZOOM_STEPS = [
  { meters: 150, label: '150 M' },
  { meters: 300, label: '300 M' },
  { meters: 500, label: '500 M' },
  { meters: 750, label: '750 M' },
  { meters: 1500, label: '1.5 KM' }
];
let zoomIdx = 1;
let vehIconType = 'truck';
try{ if (localStorage.getItem('veh_icon') === 'arrow') vehIconType = 'arrow'; }catch{}
const M_LAT = 110540;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const OVERPASS = [
  'https://overpass-api.de/api/interpreter',
  'https://z.overpass-api.de/api/interpreter',
  'https://lz4.overpass-api.de/api/interpreter',
  'https://overpass.private.coffee/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter',
  'https://overpass.openstreetmap.fr/api/interpreter'
];
const HW_ALL  = 'motorway|motorway_link|trunk|trunk_link|primary|primary_link|secondary|secondary_link|tertiary|tertiary_link|unclassified|residential|living_street';
const HW_MAIN = 'motorway|motorway_link|trunk|trunk_link|primary|primary_link|secondary|secondary_link';

let roadWays = [], roadAnchorSet = false, ancLat = 0, ancLon = 0, ancMLon = 111320;
let roadFetchLat = null, roadFetchLon = null, roadFetchAt = 0, roadFetchRadiusKm = 1.3;
let roadLastTryAt = 0, roadLoading = false, roadLoadStart = 0, roadRetryTimer = null, roadLastErr = '';
let liveRaw = [], liveIndex = null;
const loadedCells = new Map(), loadedLive = new Map();
let targetLat = null, targetLon = null, renderLat = null, renderLon = null;
let fixLat = null, fixLon = null, fixSpeed = 0, fixHead = 0, fixTime = 0;
let targetHeading = 0, renderHeading = 0, roadAnimRaf = null, lastStepTs = 0;
let pulsePhase = 0, lastDrawT = performance.now();

function roadSize(){
  roadCv.width = Math.max(1, Math.round(roadCv.clientWidth * DPR));
  roadCv.height = Math.max(1, Math.round(roadCv.clientHeight * DPR));
  drawRoadMap();
}

/* --- Akıcı hareket: GPS saniyede 1 kez gelir, aradaki kareleri hız ve yönden tahmin ederek 60 fps çizer --- */
function kickRoadAnim(){ if (!roadAnimRaf) roadAnimRaf = requestAnimationFrame(stepRoadAnim); }
function stepRoadAnim(ts){
  roadAnimRaf = null;
  if (targetLat === null || targetLon === null) return;
  let tl = targetLat, tn = targetLon;
  const age = (Date.now() - fixTime) / 1000;
  const driving = !manual && fixLat !== null && fixSpeed > 0.8 && age < 6;
  if (driving){
    const a = Math.min(age, 3), hr = fixHead * Math.PI / 180;
    tl = fixLat + fixSpeed * a * Math.cos(hr) / M_LAT;
    tn = fixLon + fixSpeed * a * Math.sin(hr) / (111320 * Math.cos(tl * Math.PI / 180));
  }
  if (renderLat === null){
    renderLat = tl; renderLon = tn; renderHeading = targetHeading; lastStepTs = ts || 0;
    drawRoadMap();
    if (driving) kickRoadAnim();
    return;
  }
  const dt = lastStepTs ? Math.min(0.1, Math.max(0.001, (ts - lastStepTs) / 1000)) : 0.016;
  lastStepTs = ts || 0;
  const k = 1 - Math.exp(-dt * 9), kh = 1 - Math.exp(-dt * 7);
  const dLat = tl - renderLat, dLon = tn - renderLon;
  const dHead = ((targetHeading - renderHeading + 540) % 360) - 180;
  const settled = Math.abs(dLat) < 1e-7 && Math.abs(dLon) < 1e-7 && Math.abs(dHead) < 0.25;
  if (settled){ renderLat = tl; renderLon = tn; renderHeading = targetHeading; }
  else {
    renderLat += dLat * k; renderLon += dLon * k;
    renderHeading = (renderHeading + dHead * kh + 360) % 360;
  }
  drawRoadMap();
  if (driving || !settled) roadAnimRaf = requestAnimationFrame(stepRoadAnim); else lastStepTs = 0;
}

function handleZoomTap(e){
  if (e) e.stopPropagation();
  if (!roadWays.length && targetLat !== null && !roadLoading){
    fetchRoadNetwork(targetLat, targetLon, true);

  }
  zoomIdx = (zoomIdx + 1) % ZOOM_STEPS.length;
  $('roadZoomLbl').textContent = ZOOM_STEPS[zoomIdx].label;
  drawRoadMap();
  toast('Görüş: ' + ZOOM_STEPS[zoomIdx].label);
}

function toggleVehicleIcon(e){

/* --- Telefon deposu (IndexedDB) --- */
let idbP = null;
function idb(){
  if (idbP) return idbP;
  idbP = new Promise((res, rej) => {
    try{
      const rq = indexedDB.open('kabin-harita', 1);
      rq.onupgradeneeded = () => { const d = rq.result; ['cells', 'live', 'meta'].forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n); }); };
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
    }catch(e){ rej(e); }
  });
  idbP.catch(() => { idbP = null; });
  return idbP;
}
function idbOp(store, mode, fn){
  return idb().then(db => new Promise((res, rej) => {
    const tx = db.transaction(store, mode);
    const rq = fn(tx.objectStore(store));
    tx.oncomplete = () => res(rq && rq.result);
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error);
  }));
}
const idbGet = (s, k) => idbOp(s, 'readonly', o => o.get(k));
const idbPut = (s, k, v) => idbOp(s, 'readwrite', o => o.put(v, k));
const idbDel = (s, k) => idbOp(s, 'readwrite', o => o.delete(k));
const idbKeys = s => idbOp(s, 'readonly', o => o.getAllKeys());
const idbClear = s => idbOp(s, 'readwrite', o => o.clear());

/* --- Yol verisi: ham biçim (enlem/boylam düz dizi) ve yerel (metre) biçim --- */
function rawFromElements(els){
  const out = [];
  for (const el of els){
    if (el.type !== 'way' || !Array.isArray(el.geometry) || el.geometry.length < 2) continue;
    const tg = el.tags || {};
    const k = tg.highway ? tg.highway : tg.railway ? 'rail' : tg.waterway ? 'river' : tg.natural === 'coastline' ? 'coast' : null;
    if (!k) continue;
    const pts = []; let a0 = 90, a1 = -90, o0 = 180, o1 = -180;
    for (const g of el.geometry){
      if (!g || g.lat == null) continue;
      pts.push(+g.lat.toFixed(5), +g.lon.toFixed(5));
      if (g.lat < a0) a0 = g.lat; if (g.lat > a1) a1 = g.lat;
      if (g.lon < o0) o0 = g.lon; if (g.lon > o1) o1 = g.lon;
    }
    if (pts.length < 4) continue;
    out.push({ id: el.id, k, ref: tg.ref || '', name: tg.name || '', pts, b: [a0, a1, o0, o1] });
  }
  return out;
}
const CLS = { motorway:0, motorway_link:0, trunk:0, trunk_link:0, primary:1, primary_link:1, secondary:2, secondary_link:2, tertiary:3, tertiary_link:3 };
function toLocal(w, lat, lon, mLon){
  const p = w.pts, m = [];
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (let i = 0; i < p.length; i += 2){
    const x = (p[i+1] - lon) * mLon, y = (p[i] - lat) * M_LAT;
    m.push([x, y]);
    if (x < x0) x0 = x; if (x > x1) x1 = x;
    if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  const k = w.k;
  const cls = k === 'rail' ? 6 : k === 'river' ? 7 : k === 'coast' ? 8 : (k in CLS ? CLS[k] : 4);
  return { id: w.id, hw: k, ref: w.ref, name: w.name, road: cls <= 4, cls, m, bx0: x0, bx1: x1, by0: y0, by1: y1 };
}
function rebuildLocal(lat, lon){
  const cosL = Math.max(0.2, Math.cos(lat * Math.PI / 180)), mLon = 111320 * cosL;
  const R = 0.03, RL = R / cosL;
  const seen = new Set(), out = [];
  const add = arr => {
    for (const w of arr){
      if (seen.has(w.id)) continue;
      const b = w.b;
      if (b[0] > lat + R || b[1] < lat - R || b[2] > lon + RL || b[3] < lon - RL) continue;
      seen.add(w.id);
      out.push(toLocal(w, lat, lon, mLon));
    }
  };
  add(liveRaw);
  for (const a of loadedLive.values()) add(a);
  for (const a of loadedCells.values()) add(a);
  ancLat = lat; ancLon = lon; ancMLon = mLon; roadAnchorSet = true;
  roadWays = out;
  projectNavRoute();
  drawRoadMap();
}

/* --- Önbellekten yükleme --- */
const CELL = 0.25;
let lastCacheLat = null, lastCacheLon = null, cacheBusy = false;
async function loadCaches(lat, lon){
  let changed = false;
  const iy0 = Math.floor(lat / CELL), ix0 = Math.floor(lon / CELL);
  const need = new Set();
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) need.add((iy0 + dy) + '_' + (ix0 + dx));
  for (const k of [...loadedCells.keys()]) if (!need.has(k)){ loadedCells.delete(k); changed = true; }
  for (const k of need){
    if (loadedCells.has(k)) continue;
    try{ const r = await idbGet('cells', k); if (r && r.ways){ loadedCells.set(k, r.ways); changed = true; } }catch{}
  }
  if (liveIndex === null){ try{ liveIndex = (await idbGet('meta', 'liveIndex')) || []; }catch{ liveIndex = []; } }
  const keep = new Set();
  for (const e of liveIndex){
    const [a, b] = e.k.split('_').map(Number);
    if (Math.abs(a - lat) < 0.03 && Math.abs(b - lon) < 0.04){
      keep.add(e.k);
      if (!loadedLive.has(e.k)){
        try{ const r = await idbGet('live', e.k); if (r && r.ways){ loadedLive.set(e.k, r.ways); changed = true; } }catch{}
      }
    }
  }
  for (const k of [...loadedLive.keys()]) if (!keep.has(k)){ loadedLive.delete(k); changed = true; }
  return changed;
}
function ensureLocal(lat, lon){
  if (!roadAnchorSet || distKm(ancLat, ancLon, lat, lon) > 1.2) rebuildLocal(lat, lon);
  if (!cacheBusy && (lastCacheLat === null || distKm(lastCacheLat, lastCacheLon, lat, lon) > 0.5)){
    cacheBusy = true; lastCacheLat = lat; lastCacheLon = lon;
    loadCaches(lat, lon)
      .then(ch => { if (ch) rebuildLocal(targetLat !== null ? targetLat : lat, targetLon !== null ? targetLon : lon); })
      .catch(() => {})
      .then(() => { cacheBusy = false; });
  }
}
async function saveLive(lat, lon, raw){
  try{
    const k = lat.toFixed(2) + '_' + lon.toFixed(2);
    await idbPut('live', k, { t: Date.now(), ways: raw });
    if (liveIndex === null) liveIndex = (await idbGet('meta', 'liveIndex')) || [];
    liveIndex = liveIndex.filter(e => e.k !== k);
    liveIndex.push({ k, t: Date.now() });
    while (liveIndex.length > 120){ const old = liveIndex.shift(); await idbDel('live', old.k); loadedLive.delete(old.k); }
    await idbPut('meta', 'liveIndex', liveIndex);
  }catch{}
}

/* --- Overpass --- */
function firstOk(list){
  return new Promise((resolve, reject) => {
    let left = list.length; const errs = [];
    list.forEach(p => p.then(resolve, e => { errs.push(e && e.message ? e.message : String(e)); if (--left === 0) reject(new Error(errs.join(' | '))); }));
  });
}
function overpassQuery(lat, lon, kinds, d, extras){
  const cosLat = Math.max(0.2, Math.cos(lat * Math.PI / 180));
  const dLon = d / cosLat;
  const box = `${(lat-d).toFixed(5)},${(lon-dLon).toFixed(5)},${(lat+d).toFixed(5)},${(lon+dLon).toFixed(5)}`;
  let body = `way["highway"~"^(${kinds})$"](${box});`;
  if (extras) body += `way["railway"="rail"](${box});way["waterway"="river"](${box});way["natural"="coastline"](${box});`;
  return `[out:json][timeout:20];(${body});out body geom;`;
}
async function overpassGet(q){
  const ctrls = OVERPASS.map(() => new AbortController());
  const killer = setTimeout(() => ctrls.forEach(c => c.abort()), 18000);
  try{
    return await firstOk(OVERPASS.map((ep, i) => {
      const hp = ep.split('/')[2].split('.'); const host = hp[0] === 'overpass' ? hp[1] : hp[0];
      return fetch(`${ep}?data=${encodeURIComponent(q)}`, { signal: ctrls[i].signal })
        .then(r => { if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
        .then(d => {
          if (!d || !Array.isArray(d.elements)) throw new Error('bozuk cevap');
          if (!d.elements.length && d.remark) throw new Error('sunucu zaman aşımı');
          return d;
        })
        .catch(e => { throw new Error(host + ': ' + (e && e.name === 'AbortError' ? 'süre doldu' : (e && e.message) || 'hata')); });
    }));
  } finally {
    clearTimeout(killer);
    ctrls.forEach(c => c.abort());
  }
}
let dlRot = 0;
async function overpassSeq(q, ms){
  const errs = [];
  for (let i = 0; i < OVERPASS.length; i++){
    const ep = OVERPASS[(dlRot + i) % OVERPASS.length];
    const ctrl = new AbortController(); const tm = setTimeout(() => ctrl.abort(), ms);
    try{
      const r = await fetch(`${ep}?data=${encodeURIComponent(q)}`, { signal: ctrl.signal });
      if (!r.ok) throw new Error('http ' + r.status);
      const d = await r.json();
      if (!d || !Array.isArray(d.elements)) throw new Error('bozuk cevap');
      if (!d.elements.length && d.remark) throw new Error('zaman aşımı');
      clearTimeout(tm); dlRot = (dlRot + i) % OVERPASS.length;
      return d;
    }catch(e){ clearTimeout(tm); errs.push(e && e.name === 'AbortError' ? 'süre doldu' : (e && e.message) || 'hata'); }
  }
  throw new Error(errs.join(' | '));
}

async function fetchRoadNetwork(lat, lon, force=false){
  if (lat == null || lon == null) return;
  ensureLocal(lat, lon);
  const now = Date.now();
  const moved = roadFetchLat !== null ? distKm(roadFetchLat, roadFetchLon, lat, lon) : 99;
  if (!force && liveRaw.length && moved < roadFetchRadiusKm * 0.45 && now - roadFetchAt < 300000) return;
  if (roadLoading && now - roadLoadStart < 60000) return;
  if (!force && now - roadLastTryAt < 8000) return;

  clearTimeout(roadRetryTimer);
  roadLoading = true; roadLoadStart = now; roadLastTryAt = now;
  if (!roadWays.length) $('roadStatus').textContent = 'YÜKLENİYOR';

  let data = null, radius = 1.3;
  const tiers = [[HW_ALL, 0.012, 1.3, true], [HW_MAIN, 0.018, 2, true], [HW_MAIN, 0.008, 0.9, false]];
  const errs = [];
  for (const [kinds, d, r, ex] of tiers){
    try{ data = await overpassGet(overpassQuery(lat, lon, kinds, d, ex)); radius = r; break; }
    catch(e){ errs.push(e.message); }
  }

  if (!data){
    roadLastErr = errs[errs.length - 1] || 'bilinmeyen';
    $('roadStatus').textContent = roadWays.length ? 'ÇEVRİMDIŞI' : ('AĞ ' + roadLastErr.replace(/ \| /g, ' · ')).slice(0, 110);
    roadRetryTimer = setTimeout(() => {
      if (targetLat !== null && targetLon !== null) fetchRoadNetwork(targetLat, targetLon, true);
    }, 15000);
    roadLoading = false;
    return;
  }

  try{
    const raw = rawFromElements(data.elements);
    liveRaw = raw;
    roadFetchLat = lat; roadFetchLon = lon; roadFetchAt = Date.now(); roadFetchRadiusKm = radius;
    roadLastErr = '';
    rebuildLocal(targetLat !== null ? targetLat : lat, targetLon !== null ? targetLon : lon);
    $('roadStatus').textContent = roadWays.length ? '' : 'YOL BULUNAMADI';
    saveLive(lat, lon, raw);
  }catch(e){
    roadLastErr = 'işleme: ' + (e && e.message);
    $('roadStatus').textContent = ('HATA ' + roadLastErr).slice(0, 60);
  }finally{
    roadLoading = false;
  }
}

/* --- Çevrimdışı indirme: İzmir · Aydın · Muğla --- */
const REGION_BOX = [[37.8, 39.4, 26.1, 28.4], [37.5, 38.2, 27.2, 28.9], [36.5, 37.6, 27.3, 29.5]];
function regionCells(){
  const seen = new Set(), list = [];
  for (const [a, b, c, d] of REGION_BOX){
    for (let iy = Math.floor(a / CELL); iy <= Math.floor(b / CELL); iy++)
      for (let ix = Math.floor(c / CELL); ix <= Math.floor(d / CELL); ix++){
        const k = iy + '_' + ix;
        if (!seen.has(k)){ seen.add(k); list.push([iy, ix]); }
      }
  }
  return list;
}
function cellQuery(iy, ix){
  const s = (iy * CELL).toFixed(4), w = (ix * CELL).toFixed(4), n = ((iy + 1) * CELL).toFixed(4), e = ((ix + 1) * CELL).toFixed(4);
  const box = `${s},${w},${n},${e}`;
  return `[out:json][timeout:80];(way["highway"~"^(${HW_MAIN})$"](${box});way["railway"="rail"](${box});way["waterway"="river"](${box});way["natural"="coastline"](${box}););out body geom;`;
}
let dlRunning = false, dlCancel = false;
function setDl(text, frac){
  $('dlText').textContent = text;
  if (frac != null) $('dlBar').style.width = Math.round(frac * 100) + '%';
}
async function storageInfo(){
  try{
    const n = (await idbKeys('cells')).length, tot = regionCells().length;
    let mb = '';
    if (navigator.storage && navigator.storage.estimate){ const e = await navigator.storage.estimate(); mb = ' · ' + Math.round((e.usage || 0) / 1048576) + ' MB'; }
    $('dlInfo').textContent = `Telefonda: ${n}/${tot} bölge${mb}`;
    if (!dlRunning) $('dlBar').style.width = Math.round(n / tot * 100) + '%';
  }catch{ $('dlInfo').textContent = 'Telefon deposu kullanılamıyor'; }
}
async function toggleDownload(){
  if (dlRunning){ dlCancel = true; setDl('Durduruluyor…'); return; }
  let have;
  try{ have = new Set(await idbKeys('cells')); }
  catch{ setDl('Telefon deposu kullanılamıyor (Özel gezinme açık olabilir)'); return; }
  dlRunning = true; dlCancel = false; $('dlBtn').textContent = 'Durdur';
  try{ if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch{}
  const cells = regionCells();
  let done = cells.filter(([y, x]) => have.has(y + '_' + x)).length, failed = 0;
  setDl(`${done}/${cells.length} hazır`, done / cells.length);
  for (const [iy, ix] of cells){
    if (dlCancel) break;
    const key = iy + '_' + ix;
    if (have.has(key)) continue;
    let ok = false;
    for (let tries = 0; tries < 3 && !ok && !dlCancel; tries++){
      try{
        setDl(`İndiriliyor ${done + 1}/${cells.length}` + (tries ? ` (deneme ${tries + 1})` : ''), done / cells.length);
        const data = await overpassSeq(cellQuery(iy, ix), 90000);
        await idbPut('cells', key, { t: Date.now(), ways: rawFromElements(data.elements) });
        ok = true; done++;
      }catch{ await sleep(2500); }
    }
    if (!ok && !dlCancel) failed++;
    await sleep(400);
  }
  dlRunning = false; $('dlBtn').textContent = 'İndir';
  if (dlCancel) setDl(`Durduruldu: ${done}/${cells.length} hazır`, done / cells.length);
  else if (failed) setDl(`${done}/${cells.length} hazır, ${failed} bölge inmedi. Tekrar İndir'e bas`, done / cells.length);
  else setDl(`İndirme tamam: ${done}/${cells.length} bölge`, 1);
  storageInfo();
  lastCacheLat = null;
  if (targetLat !== null) ensureLocal(targetLat, targetLon);
}
async function clearOffline(){
  if (dlRunning){ setDl('Önce indirmeyi durdur'); return; }
  try{ await idbClear('cells'); await idbClear('live'); await idbClear('meta'); }catch{}
  loadedCells.clear(); loadedLive.clear(); liveIndex = []; lastCacheLat = null;
  setDl('Çevrimdışı harita silindi', 0); storageInfo();
  if (targetLat !== null) rebuildLocal(targetLat, targetLon);
}

function parseManeuverIcon(step){
  const m = step.maneuver || {};

  if (t === 'roundabout' || t === 'rotary' || t === 'roundabout turn') return 'roundabout';
  if (t === 'exit roundabout' || t === 'exit rotary') return 'slight-right';
  if (mod === 'uturn' || t === 'uturn') return 'uturn';

const metricCache = {};

function fmtRemKm(m){
  if (m == null || !isFinite(m)) return '--';
  if (m < 1000) return `${Math.max(0, Math.round(m))} m`;
  const km = m / 1000;
  return km >= 100 ? `${Math.round(km)} km` : `${km.toFixed(1)} km`;
}
function fmtEta(sec){
  if (sec == null || !isFinite(sec)) return '--';
  const mins = Math.max(1, Math.round(sec / 60));
  const h = Math.floor(mins / 60), m = mins % 60;
  const durStr = h > 0 ? (m > 0 ? `${h} sa ${m} dk` : `${h} sa`) : `${m} dk`;
  const arr = new Date(Date.now() + mins * 60000);
  return `${durStr} · ${pad(arr.getHours())}:${pad(arr.getMinutes())}`;
}
function snapToPolyline(px, py, pts, cum, from = 0, to = pts.length - 1){
  let bestDSq = Infinity, bestSeg = from, bestT = 0, bestX = pts[from][0], bestY = pts[from][1];
  for (let i = from; i < to; i++){
    const ax = pts[i][0], ay = pts[i][1], bx = pts[i+1][0], by = pts[i+1][1];
    const dx = bx - ax, dy = by - ay, l2 = dx*dx + dy*dy;
    let t = l2 > 0 ? ((px - ax)*dx + (py - ay)*dy) / l2 : 0;
    t = Math.max(0, Math.min(1, t));
    const cx = ax + t*dx, cy = ay + t*dy;
    const dSq = (px - cx)*(px - cx) + (py - cy)*(py - cy);
    if (dSq < bestDSq){ bestDSq = dSq; bestSeg = i; bestT = t; bestX = cx; bestY = cy; }
  }
  const segLen = cum[bestSeg + 1] - cum[bestSeg];
  return {
    pt: [bestX, bestY],
    seg: bestSeg,
    t: bestT,
    along: cum[bestSeg] + bestT * segLen,
    offDist: Math.sqrt(bestDSq)
  };
}

function projectNavRoute(){
  if (!navRoute || !roadAnchorSet) return;
  const pts = navRoute.coords.map(([la, lo]) => [(lo - ancLon) * ancMLon, (la - ancLat) * M_LAT]);
  const cum = [0];
  for (let i = 1; i < pts.length; i++){
    cum.push(cum[i-1] + Math.hypot(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]));
  }
  navRoute.localPts = pts;
  navRoute.cum = cum;
  navRoute.totalLen = Math.max(1, cum[cum.length - 1]);

  navRoute.steps.forEach((st, idx) => {
    if (idx === navRoute.steps.length - 1){ st.along = navRoute.totalLen; st.xy = pts[pts.length - 1]; return; }
    const sx = (st.lon - ancLon) * ancMLon, sy = (st.lat - ancLat) * M_LAT;
    const sn = snapToPolyline(sx, sy, pts, cum);
    st.along = sn.along;
    st.xy = sn.pt;
  });
}

function playTurnChime(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!navAudioCtx) navAudioCtx = new AC();
    if (navAudioCtx.state === 'suspended') navAudioCtx.resume();
    const now = navAudioCtx.currentTime;
    [587.33, 880].forEach((freq, i) => {
      const osc = navAudioCtx.createOscillator(), g = navAudioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now + i * 0.13);
      g.gain.setValueAtTime(0.001, now + i * 0.13);
      g.gain.exponentialRampToValueAtTime(0.14, now + i * 0.13 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.13 + 0.22);
      osc.connect(g); g.connect(navAudioCtx.destination);
      osc.start(now + i * 0.13); osc.stop(now + i * 0.13 + 0.24);
    });
  }catch{}
}

async function startRouteTo(destName, destLat, destLon, isReroute=false){
  if (targetLat === null || targetLon === null){
    toast('Önce GPS konumu bekleniyor');
    return;
  }
  if (!isReroute){
    saveRecentDest({ name: destName, lat: destLat, lon: destLon });
    $('navHud').classList.add('on');
    $('navOpenBtn').classList.add('on');
    $('navMetrics').classList.add('on');
    setNavHud('straight', '…');
    setMetric('remDist', '…'); setMetric('remEta', '…');
  }

  const coordsParam = `${targetLon.toFixed(6)},${targetLat.toFixed(6)};${destLon.toFixed(6)},${destLat.toFixed(6)}`;
  const endpoints = [
    `https://routing.openstreetmap.de/routed-car/route/v1/driving/${coordsParam}?overview=full&geometries=geojson&steps=true`,
    `https://router.project-osrm.org/route/v1/driving/${coordsParam}?overview=full&geometries=geojson&steps=true`
  ];

  let routeData = null;
  for (const url of endpoints){
    try{
      const ctrl = new AbortController();
      const tm = setTimeout(() => ctrl.abort(), 10000);
      const res = await fetch(url, { signal: ctrl.signal });
      clearTimeout(tm);
      if (!res.ok) continue;
      const d = await res.json();
      if (d && d.code === 'Ok' && d.routes && d.routes[0]){ routeData = d.routes[0]; break; }
    }catch{}
  }

  if (!routeData){
    if (!isReroute){ cancelNav(false); toast('Rota hesaplanamadı, interneti kontrol et'); }
    return;
  }

  const rawCoords = routeData.geometry.coordinates.map(([lo, la]) => [la, lo]);
  const rawSteps = [];
  (routeData.legs || []).forEach(leg => {
    (leg.steps || []).forEach(st => {
      const ico = parseManeuverIcon(st);
      const loc = (st.maneuver && st.maneuver.location) || [destLon, destLat];
      rawSteps.push({ lon: loc[0], lat: loc[1], ico, along: 0, xy: null });
    });
  });

  navRoute = {
    destName,
    destLat,
    destLon,
    coords: rawCoords,
    localPts: [],
    cum: [0],
    totalLen: routeData.distance || 1,
    steps: rawSteps,
    totalDur: routeData.duration || 0,
    lastSeg: null
  };
  lastChimeStep = -1;
  if (!roadAnchorSet) rebuildLocal(targetLat, targetLon);
  else projectNavRoute();

  setMetric('remDist', fmtRemKm(navRoute.totalLen));
  setMetric('remEta', fmtEta(navRoute.totalDur));
  syncNavUiState();
  drawRoadMap();
  if (!isReroute) toast(`Rota hazır: ${fmtNavDist(navRoute.totalLen)}`);
}

function updateNavProgress(ox, oy){
  if (!navRoute || !navRoute.localPts.length) return null;
  const pts = navRoute.localPts, cum = navRoute.cum;

  let snap = null;
  if (navRoute.lastSeg != null){
    snap = snapToPolyline(ox, oy, pts, cum, Math.max(0, navRoute.lastSeg - 4), Math.min(pts.length - 1, navRoute.lastSeg + 80));
    if (snap.offDist > 45) snap = null;
  }
  if (!snap) snap = snapToPolyline(ox, oy, pts, cum);
  navRoute.lastSeg = snap.seg;

  if (!manual && !navRerouting && snap.offDist > 65 && Date.now() - lastRerouteAt > 12000){
    lastRerouteAt = Date.now();
    navRerouting = true;
    setNavHud(navHudIco || 'straight', '…');
    startRouteTo(navRoute.destName, navRoute.destLat, navRoute.destLon, true).finally(() => { navRerouting = false; });
    return { snap, nextStep: null, distToTurn: 0 };
  }

  const remDist = Math.max(0, navRoute.totalLen - snap.along);
  const remSec = (navRoute.totalDur || 0) * (navRoute.totalLen > 0 ? Math.max(0, Math.min(1, remDist / navRoute.totalLen)) : 0);
  let nextIdx = navRoute.steps.length - 1;
  for (let i = 1; i < navRoute.steps.length; i++){
    if (navRoute.steps[i].along > snap.along + 10){ nextIdx = i; break; }
  }
  const step = navRoute.steps[nextIdx] || navRoute.steps[navRoute.steps.length - 1];
  const distToTurn = Math.max(0, step.along - snap.along);

  if (remDist < 28){
    setNavHud('arrive', 'VARIŞ');
    setMetric('remDist', '0 m'); setMetric('remEta', 'Varıldı');
    if (lastChimeStep !== 9999){ lastChimeStep = 9999; playTurnChime(); }
    return { snap, nextStep: step, distToTurn };
  }

  if (distToTurn <= 120 && lastChimeStep !== nextIdx){
    lastChimeStep = nextIdx;
    playTurnChime();
  }

  setNavHud(step.ico, fmtNavDist(distToTurn));
  setMetric('remDist', fmtRemKm(remDist));
  setMetric('remEta', fmtEta(remSec));
  return { snap, nextStep: step, distToTurn };
}

/* --- Çizim --- */
function ptSegDistSq(px, py, ax, ay, bx, by){
  const dx = bx - ax, dy = by - ay;
  const lenSq = dx*dx + dy*dy;
  let t = lenSq > 0 ? ((px - ax)*dx + (py - ay)*dy) / lenSq : 0;
  t = Math.max(0, Math.min(1, t));
  const cx = ax + t*dx, cy = ay + t*dy;
  return (px - cx)*(px - cx) + (py - cy)*(py - cy);
}
const STYLE = {
  0: ['rgba(255,255,255,0.52)', 2.6], 1: ['rgba(255,255,255,0.44)', 2.1], 2: ['rgba(255,255,255,0.36)', 1.7],
  3: ['rgba(255,255,255,0.28)', 1.35], 4: ['rgba(255,255,255,0.20)', 1.1],
  6: ['rgba(255,255,255,0.24)', 1.1, [6, 5]], 7: ['rgba(99,167,207,0.44)', 1.4], 8: ['rgba(99,167,207,0.56)', 1.6]
};
const DRAW_ORDER = [8, 7, 6, 4, 3, 2, 1, 0];
let fadeCache = { w: 0, h: 0, gx: null, gy: null };

function collectRoute(pts, seg, p0, dir, maxLen){
  const P = [p0], D = [0];
  let len = 0, j = dir === 1 ? seg + 1 : seg;
  while (j >= 0 && j < pts.length && len < maxLen){
    const last = P[P.length - 1];
    len += Math.hypot(pts[j][0] - last[0], pts[j][1] - last[1]);
    P.push(pts[j]); D.push(len);
    j += dir;
  }
  return { P, D, len: Math.max(len, 1) };
}
function routePointAt(R, d){
  const P = R.P, D = R.D;
  for (let i = 1; i < P.length; i++){
    if (D[i] >= d){
      const span = (D[i] - D[i-1]) || 1, k = (d - D[i-1]) / span;
      return [P[i-1][0] + (P[i][0] - P[i-1][0]) * k, P[i-1][1] + (P[i][1] - P[i-1][1]) * k];
    }
  }
  return null;
}
const mixRGB = (a, b, k) => `${Math.round(a[0] + (b[0] - a[0]) * k)},${Math.round(a[1] + (b[1] - a[1]) * k)},${Math.round(a[2] + (b[2] - a[2]) * k)}`;

function drawEuroTruck(ctx, tx, ty, dp){
  ctx.save();
  ctx.translate(tx, ty);
  const s = dp;

  // 1. Ön Far Işık Huzmeleri (uzun yumuşak koni + güçlü yakın çekirdek)

    outerG.addColorStop(0, 'rgba(255, 248, 224, 0.36)');
    outerG.addColorStop(0.45, 'rgba(255, 244, 210, 0.13)');
    outerG.addColorStop(1, 'rgba(255, 244, 210, 0)');
    ctx.fillStyle = outerG;
    ctx.beginPath();
    ctx.moveTo(lx - 1.5 * s, -27 * s);
    ctx.lineTo(lx - 15 * s, -78 * s);
    ctx.lineTo(lx + 15 * s, -78 * s);
    ctx.lineTo(lx + 1.5 * s, -27 * s);
    ctx.closePath();
    ctx.fill();

    const innerG = ctx.createLinearGradient(lx, -27 * s, lx, -50 * s);
    innerG.addColorStop(0, 'rgba(255, 255, 245, 0.55)');
    innerG.addColorStop(1, 'rgba(255, 255, 245, 0)');
    ctx.fillStyle = innerG;
    ctx.beginPath();
    ctx.moveTo(lx - 1.1 * s, -27 * s);
    ctx.lineTo(lx - 6.5 * s, -50 * s);
    ctx.lineTo(lx + 6.5 * s, -50 * s);
    ctx.lineTo(lx + 1.1 * s, -27 * s);
    ctx.closePath();
    ctx.fill();
  });

  // 2. Arka Stop Lambaları Kırmızı Yansıma Halesi
  [-4.6 * s, 4.6 * s].forEach(rx => {
    const rg = ctx.createRadialGradient(rx, 28.2 * s, 0.5 * s, rx, 29.5 * s, 12.5 * s);
    rg.addColorStop(0, 'rgba(255, 28, 42, 0.62)');
    rg.addColorStop(0.5, 'rgba(255, 20, 36, 0.22)');
    rg.addColorStop(1, 'rgba(255, 20, 36, 0)');
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.arc(rx, 29.5 * s, 12.5 * s, 0, Math.PI * 2);
    ctx.fill();
  });

  // 3. Zemin Gölgesi
  ctx.save();
  ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
  ctx.shadowBlur = 7 * s;
  ctx.shadowOffsetY = 2 * s;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';

  // 4. Dorse (Articulated Trailer: y = -11.5s .. +27.5s)

  trG.addColorStop(0.5, '#2b2f38');
  trG.addColorStop(0.75, '#23262e');

  ctx.fillStyle = trG;
  ctx.strokeStyle = `rgba(${TH.core}, 0.68)`;

  ctx.roundRect(-7.2 * s, -11.5 * s, 14.4 * s, 39 * s, 1.4 * s);

  // Dorse yan turuncu gabari LED'leri

  ctx.beginPath();

  // Kabin tavan rüzgarlığı (aerodinamik spoiler çizgisi)

  ctx.moveTo(-5.8 * s, -17.2 * s);
  ctx.quadraticCurveTo(0, -18.5 * s, 5.8 * s, -17.2 * s);

  // Panoramik Avrupa Ön Camı
  ctx.fillStyle = '#07090d';
  ctx.beginPath();
  ctx.moveTo(-6.1 * s, -25.4 * s);
  ctx.quadraticCurveTo(0, -26.5 * s, 6.1 * s, -25.4 * s);
  ctx.lineTo(5.5 * s, -22.8 * s);
  ctx.quadraticCurveTo(0, -23.6 * s, -5.5 * s, -22.8 * s);
  ctx.closePath();
  ctx.fill();

  // Ön cam yansıma çizgisi
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.24)';

  ctx.moveTo(-4.6 * s, -24.7 * s);
  ctx.quadraticCurveTo(0, -25.5 * s, 4.6 * s, -24.7 * s);

  // Avrupa Tipi İleri Uzanan Yan Aynalar
  ctx.strokeStyle = `rgba(${TH.core}, 0.85)`;

  ctx.beginPath();
  ctx.moveTo(-7.4 * s, -24.4 * s); ctx.lineTo(-9.5 * s, -25.5 * s); ctx.lineTo(-9.5 * s, -23.4 * s);
  ctx.moveTo(7.4 * s, -24.4 * s); ctx.lineTo(9.5 * s, -25.5 * s); ctx.lineTo(9.5 * s, -23.4 * s);
  ctx.stroke();

  // Tavan Tepe / Gabari Nokta Işıkları (Tema Renginde)
  ctx.fillStyle = `rgb(${TH.core})`;
  [-2.6 * s, 0, 2.6 * s].forEach(dx => {
    ctx.beginPath();
    ctx.arc(dx, -26.4 * s, 0.55 * s, 0, Math.PI * 2);

  // Ön LED Far Lensleri (Parlak Beyaz-Altın Çekirdek)
  [-5.1 * s, 5.1 * s].forEach(lx => {
    ctx.fillStyle = '#fff5cc';
    ctx.beginPath();
    ctx.roundRect(lx - 1.5 * s, -27.8 * s, 3 * s, 1.2 * s, 0.5 * s);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(lx - 0.9 * s, -27.7 * s, 1.8 * s, 0.7 * s);

  ctx.restore();
}

function drawRoadMap(){
  const w = roadCv.width, h = roadCv.height;
  if (!w || !h) return;
  const dp = DPR;
  const br = 0.88 + 0.12 * Math.sin(Date.now() / 800);
  const tNow = performance.now();
  const dtD = Math.min(0.2, Math.max(0, (tNow - lastDrawT) / 1000));
  lastDrawT = tNow;
  rctx.setTransform(1, 0, 0, 1, 0, 0);
  rctx.globalCompositeOperation = 'source-over';
  rctx.clearRect(0, 0, w, h);
  const tx = w * 0.5, ty = h * 0.78;

  if (renderLat === null || renderLon === null){
    rctx.fillStyle = 'rgba(245,245,247,.25)';
    rctx.beginPath(); rctx.arc(tx, ty, 4 * dp, 0, Math.PI * 2); rctx.fill();
    return;
  }

  const zoomMeters = ZOOM_STEPS[zoomIdx].meters;
  const ppm = (h * 0.78) / zoomMeters;
  const ox = (renderLon - ancLon) * ancMLon, oy = (renderLat - ancLat) * M_LAT;
  const R = Math.max(zoomMeters * 1.6, manual ? 460 : 160);

  const buckets = [[], [], [], [], [], [], [], [], []];
  let best = null, bestSeg = 0, bestD = Infinity;
  for (const way of roadWays){
    if (way.bx0 - R > ox || way.bx1 + R < ox || way.by0 - R > oy || way.by1 + R < oy) continue;
    buckets[way.cls].push(way);
    if (!way.road) continue;
    const pts = way.m;
    for (let i = 0; i < pts.length - 1; i++){
      const d = ptSegDistSq(ox, oy, pts[i][0], pts[i][1], pts[i+1][0], pts[i+1][1]);
      if (d < bestD){ bestD = d; best = way; bestSeg = i; }
    }
  }
  const matchRadius = manual ? 450 : 120;
  const matched = best && bestD <= matchRadius * matchRadius ? best : null;

  const navState = navRoute ? updateNavProgress(ox, oy) : null;

  const rad = renderHeading * Math.PI / 180;
  const X = p => (p[0] - ox) * ppm, Y = p => -(p[1] - oy) * ppm;
  const range = zoomMeters * 1.3;

  rctx.save();
  rctx.translate(tx, ty);
  rctx.rotate(-rad);
  rctx.lineCap = 'round';
  rctx.lineJoin = 'round';

  for (const c of DRAW_ORDER){
    const list = buckets[c];
    if (!list.length) continue;
    const st = STYLE[c];
    rctx.strokeStyle = st[0];
    rctx.lineWidth = st[1] * dp;
    if (st[2]) rctx.setLineDash(st[2].map(v => v * dp));
    rctx.beginPath();
    for (const way of list){
      const pts = way.m;
      for (let i = 0; i < pts.length; i++){
        if (i === 0) rctx.moveTo(X(pts[i]), Y(pts[i])); else rctx.lineTo(X(pts[i]), Y(pts[i]));
      }
    }
    rctx.stroke();
    if (st[2]) rctx.setLineDash([]);
  }

  /* --- Rota parlaması: yakında açık renk, uzaklaştıkça tema rengine süzülür ve söner --- */
  const fadeStroke = (Rt, rng, aMax, aMin, wCore, wHalo, haloMul, colA, colB) => {
    if (Rt.P.length < 2) return;
    const N = 10;
    for (let c = 0; c < N; c++){
      rctx.beginPath();
      let any = false;
      for (let i = 1; i < Rt.P.length; i++){
        const mid = (Rt.D[i-1] + Rt.D[i]) / 2;
        if (Math.min(N - 1, Math.floor(mid / rng * N)) !== c) continue;
        rctx.moveTo(X(Rt.P[i-1]), Y(Rt.P[i-1])); rctx.lineTo(X(Rt.P[i]), Y(Rt.P[i]));
        any = true;
      }
      if (!any) continue;
      const k = (c + 0.5) / N, al = aMax - (aMax - aMin) * k;
      rctx.lineCap = 'butt';
      rctx.strokeStyle = `rgba(${TH.acc},${(al * haloMul * br).toFixed(3)})`;
      rctx.lineWidth = wHalo * dp; rctx.stroke();
      rctx.lineCap = 'round';
      rctx.strokeStyle = `rgba(${mixRGB(colA, colB, Math.min(1, k * 1.2))},${al.toFixed(3)})`;
      rctx.lineWidth = wCore * dp; rctx.stroke();
    }
    rctx.lineCap = 'round';
  };
  const drawPulses = (Rt) => {
    const spacing = 90, lim = Math.min(Rt.len, range);
    for (let d = pulsePhase; d < lim; d += spacing){
      const pt = routePointAt(Rt, d); if (!pt) break;
      const al = 0.9 * Math.pow(Math.max(0, 1 - d / range), 1.3) * Math.min(1, d / 25);
      if (al < 0.03) continue;
      const x = X(pt), y = Y(pt);
      const g = rctx.createRadialGradient(x, y, 0, x, y, 9 * dp);
      g.addColorStop(0, `rgba(${TH.core},${al.toFixed(3)})`); g.addColorStop(1, `rgba(${TH.core},0)`);
      rctx.fillStyle = g; rctx.beginPath(); rctx.arc(x, y, 9 * dp, 0, 6.2832); rctx.fill();
      rctx.fillStyle = `rgba(255,255,255,${(al * 0.9).toFixed(3)})`; rctx.beginPath(); rctx.arc(x, y, 2.1 * dp, 0, 6.2832); rctx.fill();
    }
  };
  const drawConnector = (p, dist) => {
    if (dist < 10 || dist > 200) return;
    rctx.save();
    rctx.setLineDash([3 * dp, 5 * dp]);
    rctx.lineCap = 'round';
    rctx.strokeStyle = `rgba(${TH.core},0.55)`;
    rctx.lineWidth = 1.3 * dp;
    rctx.beginPath(); rctx.moveTo(0, 0); rctx.lineTo(X(p), Y(p)); rctx.stroke();
    rctx.restore();
  };

  if (navRoute && navRoute.localPts.length >= 2){
    const rPts = navRoute.localPts;
    const sn = (navState && navState.snap) ? navState.snap : snapToPolyline(ox, oy, rPts, navRoute.cum);
    const ahead = collectRoute(rPts, sn.seg, sn.pt, 1, range);
    const behind = collectRoute(rPts, sn.seg, sn.pt, -1, 80);
    const ns = navState && navState.nextStep && navState.nextStep.ico !== 'arrive' ? navState.nextStep : null;
    const dTurn = navState ? navState.distToTurn : 9999;
    const boost = ns ? Math.max(0, Math.min(1, (220 - dTurn) / 120)) : 0;

    drawConnector(sn.pt, sn.offDist);
    fadeStroke(behind, 80, 0.42, 0, 2.6, 7, 0.5, TH.coreA, TH.accA);
    fadeStroke(ahead, range, 1, 0.12, 3.4 * (1 + 0.25 * boost), 11 * (1 + 0.3 * boost), 0.28 * (1 + 0.4 * boost), TH.coreA, TH.farA);
    pulsePhase = (pulsePhase + dtD * (12 + fixSpeed * 0.7)) % 90;
    drawPulses(ahead);

    if (ns && ns.xy){
      const nx = X(ns.xy), ny = Y(ns.xy);
      if (dTurn < 600){
        const inten = Math.max(0.25, Math.min(1, 1 - dTurn / 500));
        const ph = ((Date.now() / 1000) * (dTurn < 150 ? 1.6 : 0.8)) % 1;
        for (let wv = 0; wv < 2; wv++){
          const p = (ph + wv * 0.5) % 1;
          rctx.strokeStyle = `rgba(${TH.core},${((1 - p) * 0.55 * inten).toFixed(3)})`;
          rctx.lineWidth = 1.6 * dp;
          rctx.beginPath(); rctx.arc(nx, ny, (6 + p * 18) * dp, 0, 6.2832); rctx.stroke();
        }
      }
      rctx.fillStyle = `rgba(${TH.acc},0.35)`;
      rctx.beginPath(); rctx.arc(nx, ny, 9 * dp, 0, 6.2832); rctx.fill();
      rctx.fillStyle = '#ffffff';
      rctx.beginPath(); rctx.arc(nx, ny, 3.5 * dp, 0, 6.2832); rctx.fill();
    }

    const endPt = rPts[rPts.length - 1];
    const ex = X(endPt), ey = Y(endPt);
    if (Math.abs(ex) < w && Math.abs(ey) < h * 1.5){
      rctx.strokeStyle = `rgb(${TH.core})`;
      rctx.lineWidth = 2 * dp;
      rctx.beginPath(); rctx.arc(ex, ey, 8 * dp * br, 0, 6.2832); rctx.stroke();
      rctx.fillStyle = `rgb(${TH.acc})`;
      rctx.beginPath(); rctx.arc(ex, ey, 4 * dp, 0, 6.2832); rctx.fill();
    }
  } else if (matched){
    const pts = matched.m, seg = bestSeg;
    const a = pts[seg], b = pts[seg+1];
    const dx = b[0] - a[0], dy = b[1] - a[1], L2 = dx*dx + dy*dy;
    let tt = L2 > 0 ? ((ox - a[0])*dx + (oy - a[1])*dy) / L2 : 0;
    tt = Math.max(0, Math.min(1, tt));
    const p0 = [a[0] + tt*dx, a[1] + tt*dy];
    const dir = (dx * Math.sin(rad) + dy * Math.cos(rad)) >= 0 ? 1 : -1;
    const ahead = collectRoute(pts, seg, p0, dir, range);
    const behind = collectRoute(pts, seg, p0, -dir, 70);

    drawConnector(p0, Math.sqrt(bestD));
    fadeStroke(behind, 70, 0.4, 0, 2.4, 7, 0.5, TH.coreA, TH.accA);
    fadeStroke(ahead, range, 1, 0.12, 2.8, 9, 0.22, TH.coreA, TH.farA);
    if (fixSpeed > 1.5){
      pulsePhase = (pulsePhase + dtD * (12 + fixSpeed * 0.7)) % 90;
      drawPulses(ahead);
    }
  }
  rctx.restore();

  // Araç halesi
  const glow = rctx.createRadialGradient(tx, ty, 0, tx, ty, 80 * dp);
  glow.addColorStop(0, `rgba(${TH.acc},${(0.34 * br).toFixed(3)})`);
  glow.addColorStop(1, `rgba(${TH.acc},0)`);
  rctx.fillStyle = glow;
  rctx.beginPath(); rctx.arc(tx, ty, 80 * dp, 0, Math.PI * 2); rctx.fill();

  if (!fadeCache.gx || fadeCache.w !== w || fadeCache.h !== h){
    const ease = k => k <= 0 ? 0 : k >= 1 ? 1 : 0.5 - 0.5 * Math.cos(Math.PI * k);
    const gx = rctx.createLinearGradient(0, 0, w, 0);
    const gy = rctx.createLinearGradient(0, 0, 0, h);
    for (let i = 0; i <= 32; i++){
      const s = i / 32;
      gx.addColorStop(s, `rgba(0,0,0,${ease(Math.min(s, 1 - s) / 0.20).toFixed(3)})`);
      gy.addColorStop(s, `rgba(0,0,0,${(s < 0.5 ? ease(s / 0.24) : ease((1 - s) / 0.13)).toFixed(3)})`);
    }
    fadeCache = { w, h, gx, gy };
  }
  rctx.save();
  rctx.globalCompositeOperation = 'destination-in';
  rctx.fillStyle = fadeCache.gx; rctx.fillRect(0, 0, w, h);
  rctx.fillStyle = fadeCache.gy; rctx.fillRect(0, 0, w, h);
  rctx.restore();
  rctx.globalCompositeOperation = 'source-over';

  if (vehIconType === 'truck'){
    drawEuroTruck(rctx, tx, ty, dp);
  } else {
    rctx.save();
    rctx.translate(tx, ty);
    rctx.fillStyle = `rgb(${TH.arrow})`;
    rctx.beginPath();
    rctx.moveTo(0, -10 * dp);
    rctx.lineTo(7.5 * dp, 7.5 * dp);
    rctx.lineTo(0, 3.5 * dp);
    rctx.lineTo(-7.5 * dp, 7.5 * dp);
    rctx.closePath();
    rctx.fill();
    rctx.restore();
  }
}

/* ---------- RENK TEMALARI (saate dokun) ---------- */
const THEMES = {
  red:   { n:'Kırmızı',    acc:[229,72,77],   core:[255,112,96],  far:[200,50,90],   arrow:[240,138,69], play:[217,119,36], clk:[245,245,247] },
  amber: { n:'Kehribar',   acc:[255,176,0],   core:[255,205,100], far:[255,130,0],   arrow:[255,176,0],  play:[255,176,0],  clk:[255,191,71] },
  ice:   { n:'Buz mavisi', acc:[64,196,255],  core:[150,225,255], far:[60,140,255],  arrow:[95,208,255], play:[76,195,255], clk:[191,234,255] },
  green: { n:'Neon yeşil', acc:[57,255,120],  core:[150,255,185], far:[20,200,160],  arrow:[57,255,120], play:[57,255,120], clk:[168,255,198] },
  synth: { n:'Synthwave',  acc:[255,60,200],  core:[255,140,230], far:[150,90,255],  arrow:[255,79,216], play:[182,107,255],clk:[255,155,236] },
  white: { n:'Beyaz',      acc:[245,245,247], core:[255,255,255], far:[190,190,205], arrow:[255,255,255],play:[255,255,255],clk:[255,255,255] }
};
const THEME_ORDER = ['red', 'amber', 'ice', 'green', 'synth', 'white', 'auto'];
const THEME_KEYS = ['acc', 'core', 'far', 'arrow', 'play', 'clk'];
const cloneTheme = th => { const o = {}; THEME_KEYS.forEach(k => { o[k] = th[k].slice(); }); return o; };
let themeKey = 'red';
try{ const sv = localStorage.getItem('theme'); if (sv && THEME_ORDER.includes(sv)) themeKey = sv; }catch{}
let curTheme = cloneTheme(THEMES.red), tweenRaf = 0;
const TH = { acc: '229,72,77', core: '255,112,96', far: '200,50,90', arrow: '240,138,69', clk: '245,245,247',
  accA: [229,72,77], coreA: [255,112,96], farA: [200,50,90] };

function applyThemeColors(c){
  const r = a => a.map(v => Math.round(v)).join(',');
  const root = document.documentElement.style;
  root.setProperty('--acc', r(c.acc));
  root.setProperty('--play', 'rgb(' + r(c.play) + ')');
  root.setProperty('--clk', 'rgb(' + r(c.clk) + ')');
  TH.acc = r(c.acc); TH.core = r(c.core); TH.far = r(c.far); TH.arrow = r(c.arrow); TH.clk = r(c.clk);
  TH.accA = c.acc.slice(); TH.coreA = c.core.slice(); TH.farA = c.far.slice();
  if (typeof eqKick === 'function') eqKick();
  if (!roadAnimRaf) drawRoadMap();
}
function resolveTheme(){
  if (themeKey !== 'auto') return { t: THEMES[themeKey], night: false, label: THEMES[themeKey].n };
  const d = new Date(), h = d.getHours() + d.getMinutes() / 60;
  if (h >= 6.5 && h < 17.5) return { t: THEMES.ice, night: false, label: 'Buz mavisi' };
  if (h >= 17.5 && h < 20.5) return { t: THEMES.amber, night: false, label: 'Kehribar' };
  return { t: THEMES.amber, night: true, label: 'Kehribar' };
}
function setTheme(key, announce, instant){
  themeKey = key;
  try{ localStorage.setItem('theme', key); }catch{}
  const r = resolveTheme();
  $('dimLayer').style.opacity = r.night ? '0.22' : '0';
  const target = r.t;
  cancelAnimationFrame(tweenRaf);
  if (instant){ curTheme = cloneTheme(target); applyThemeColors(curTheme); }
  else {
    const from = cloneTheme(curTheme), t0 = performance.now();
    const step = () => {
      const k = Math.min(1, (performance.now() - t0) / 700);
      const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      THEME_KEYS.forEach(n => { curTheme[n] = from[n].map((v, i) => v + (target[n][i] - v) * e); });
      applyThemeColors(curTheme);
      if (k < 1) tweenRaf = requestAnimationFrame(step);
    };
    tweenRaf = requestAnimationFrame(step);
  }
  if (announce) toast('Renk: ' + (key === 'auto' ? 'Otomatik (' + r.label + ')' : THEMES[key].n));
}
$('clockT').addEventListener('click', () => {
  if (clkLong){ clkLong = false; return; }
  setTheme(THEME_ORDER[(THEME_ORDER.indexOf(themeKey) + 1) % THEME_ORDER.length], true, false);
});
setInterval(() => { if (themeKey === 'auto') setTheme('auto', false, false); }, 60000);
setInterval(() => { if (!roadAnimRaf && renderLat !== null && !document.hidden && !restMode) drawRoadMap(); }, 200);
setInterval(() => { if (navRoute && !roadAnimRaf && renderLat !== null && !document.hidden && !restMode) drawRoadMap(); }, 66);

/* ---------- ARKA PLAN EFEKTLERİ: sadece hız çizgileri ve mola modu gökyüzü ---------- */
const fxCv = $('fxCanvas'), fxCtx = fxCv.getContext('2d');
const FDPR = Math.min(2, window.devicePixelRatio || 1);
let fxOn = true;
try{ if (localStorage.getItem('fx') === 'off') fxOn = false; }catch{}
let fxCur = {}, fxSig = '', fxL = { stars: [], streaks: [] }, fxRaf = 0, fxLast = 0;
let speedLvl = 0, speedFlag = false, shootT = 25, shootCur = null;
const fxT0 = performance.now();

function fxSize(){
  fxCv.width = Math.max(1, Math.round(fxCv.clientWidth * FDPR));
  fxCv.height = Math.max(1, Math.round(fxCv.clientHeight * FDPR));
  fxBuild(); fxKick();
}
function computeFx(){
  if (!fxOn) return {};
  const f = {};
  if (restMode){ f.stars = { n: 120 }; f.aurora = true; f.shoot = true; }
  return f;
}
function setFxState(){
  const f = computeFx(), sig = JSON.stringify(f);
  if (sig !== fxSig){ fxSig = sig; fxCur = f; fxBuild(); }
  fxKick();
}
function newStreak(init){
  const w = fxCv.width, side = Math.random() < 0.5 ? -1 : 1, ang = -0.6 + Math.random() * 1.5;
  return { dx: side * Math.cos(ang), dy: Math.sin(ang), r: (init ? 0.15 + Math.random() * 0.6 : 0.15 + Math.random() * 0.1) * w,
    v: (170 + Math.random() * 230) * FDPR, len: (30 + Math.random() * 60) * FDPR, a: 0.10 + Math.random() * 0.14 };
}
function fxBuild(){
  const w = fxCv.width, h = fxCv.height, dp = FDPR, f = fxCur;
  fxL = { stars: [], streaks: [] };
  fxCtx.clearRect(0, 0, w, h);
  if (f.stars){
    for (let i = 0; i < f.stars.n; i++){
      const vx = (1 + Math.random() * 3) * dp;
      fxL.stars.push({ x: Math.random() * w, y: Math.random() * h, r: (0.5 + Math.random()) * dp, a: 0.25 + Math.random() * 0.35,
        ph: Math.random() * 6.28, sp: 0.5 + Math.random() * 1.5, vx, vy: vx * 0.3 });
    }
  }
  for (let i = 0; i < 26; i++) fxL.streaks.push(newStreak(true));
}
function fxHasLayers(){ const f = fxCur; return !!(f.stars || f.aurora); }
function fxSpeedWanted(){
  if (!fxOn) return false;
  const fresh = Date.now() - fixTime < 6000;
  if (fixSpeed >= 22.2 && fresh) speedFlag = true; else if (fixSpeed < 19 || !fresh) speedFlag = false;
  return speedFlag;
}
function fxKick(){
  if (fxRaf || document.hidden) return;
  if (fxHasLayers() || speedLvl > 0.01 || fxSpeedWanted()) fxRaf = requestAnimationFrame(fxFrame);
}
function drawAurora(w, h, t){
  const bands = [
    { c: TH.acc,  a: 0.11, y: 0.16, th: 0.26, ph: 0, sp: 0.25 },
    { c: TH.core, a: 0.08, y: 0.26, th: 0.22, ph: 2, sp: -0.18 },
    { c: TH.acc,  a: 0.06, y: 0.36, th: 0.20, ph: 4, sp: 0.14 }
  ];
  for (const b of bands){
    const pts = [];
    for (let i = 0; i <= 14; i++){
      const u = i / 14;
      pts.push([u * w, h * b.y + Math.sin(u * 8.17 + t * b.sp + b.ph) * h * 0.07 + Math.sin(u * 16.9 - t * b.sp * 0.7 + b.ph * 1.3) * h * 0.03]);
    }
    const th = h * b.th;
    const g = fxCtx.createLinearGradient(0, h * b.y - h * 0.1, 0, h * b.y + th);
    g.addColorStop(0, `rgba(${b.c},0)`); g.addColorStop(0.35, `rgba(${b.c},${b.a})`); g.addColorStop(1, `rgba(${b.c},0)`);
    fxCtx.fillStyle = g;
    fxCtx.beginPath(); fxCtx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) fxCtx.lineTo(pts[i][0], pts[i][1]);
    for (let i = pts.length - 1; i >= 0; i--) fxCtx.lineTo(pts[i][0], pts[i][1] + th);
    fxCtx.closePath(); fxCtx.fill();
  }
}
function fxFrame(ts){
  fxRaf = 0;
  if (document.hidden) return;
  if (fxLast && ts - fxLast < 33){ fxRaf = requestAnimationFrame(fxFrame); return; }
  const dt = fxLast ? Math.min(0.1, (ts - fxLast) / 1000) : 0.033;
  fxLast = ts;
  const w = fxCv.width, h = fxCv.height, dp = FDPR, f = fxCur;
  const t = (performance.now() - fxT0) / 1000;
  const spTarget = fxSpeedWanted() ? 1 : 0;
  speedLvl += (spTarget - speedLvl) * Math.min(1, dt * 0.9);
  if (!fxHasLayers() && speedLvl < 0.01 && !spTarget){ fxCtx.clearRect(0, 0, w, h); fxLast = 0; return; }
  fxCtx.clearRect(0, 0, w, h);

  if (f.aurora) drawAurora(w, h, t);
  if (f.stars){
    for (const s of fxL.stars){
      s.x += s.vx * dt; s.y += s.vy * dt;
      if (s.x > w + 2) s.x = -2; if (s.y > h + 2) s.y = -2;
      fxCtx.fillStyle = `rgba(255,255,255,${(s.a * (0.55 + 0.45 * Math.sin(t * s.sp + s.ph))).toFixed(3)})`;
      fxCtx.beginPath(); fxCtx.arc(s.x, s.y, s.r, 0, 6.2832); fxCtx.fill();
    }
  }
  if (f.shoot){
    if (!shootCur){
      shootT -= dt;
      if (shootT <= 0){
        shootCur = { x: w * (0.15 + Math.random() * 0.6), y: h * (0.05 + Math.random() * 0.3), vx: (300 + Math.random() * 160) * dp, vy: (150 + Math.random() * 90) * dp, age: 0, life: 0.9 + Math.random() * 0.4 };
        shootT = 25 + Math.random() * 35;
      }
    } else {
      const s = shootCur; s.age += dt; s.x += s.vx * dt; s.y += s.vy * dt;
      const fade = 1 - s.age / s.life;
      if (fade <= 0) shootCur = null;
      else {
        const g = fxCtx.createLinearGradient(s.x - s.vx * 0.16, s.y - s.vy * 0.16, s.x, s.y);
        g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, `rgba(255,255,255,${(0.8 * fade).toFixed(3)})`);
        fxCtx.strokeStyle = g; fxCtx.lineWidth = 1.5 * dp; fxCtx.lineCap = 'round';
        fxCtx.beginPath(); fxCtx.moveTo(s.x - s.vx * 0.16, s.y - s.vy * 0.16); fxCtx.lineTo(s.x, s.y); fxCtx.stroke();
      }
    }
  }
  if (speedLvl > 0.01){
    const cx = w * 0.5, cy = h * 0.42, maxR = Math.hypot(w, h) * 0.55;
    const boost = 1 + Math.max(0, Math.min(1.5, (fixSpeed - 22) / 30));
    fxCtx.lineCap = 'round'; fxCtx.lineWidth = 1.1 * dp;
    for (const s of fxL.streaks){
      s.r += s.v * boost * dt;
      const x1 = cx + s.dx * s.r, y1 = cy + s.dy * s.r;
      if (x1 < -40 || x1 > w + 40 || y1 > h + 40 || y1 < -40 || s.r > maxR * 1.3){ Object.assign(s, newStreak(false)); continue; }
      const len = s.len * (0.4 + s.r / maxR), fadeIn = Math.min(1, Math.max(0, (s.r - 0.18 * w) / (0.3 * w)));
      const al = s.a * speedLvl * fadeIn;
      if (al < 0.004) continue;
      fxCtx.strokeStyle = `rgba(${TH.core},${al.toFixed(3)})`;
      fxCtx.beginPath(); fxCtx.moveTo(x1, y1); fxCtx.lineTo(x1 + s.dx * len, y1 + s.dy * len); fxCtx.stroke();
    }
  }
  fxRaf = requestAnimationFrame(fxFrame);
}
$('art').addEventListener('click', () => {
  fxOn = !fxOn;
  try{ localStorage.setItem('fx', fxOn ? 'on' : 'off'); }catch{}
  setFxState();
  toast('Efektler: ' + (fxOn ? 'Açık' : 'Kapalı'));
});

/* ---------- MOLA MODU (3 dk hareketsiz kalınca) ---------- */
const REST_AFTER = 3 * 60 * 1000;
let restMode = false, lastMoveAt = Date.now(), restRef = null, restSnoozeUntil = 0, clkLong = false, clkPress = 0;
const MONTHS = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
function updateRest(){

  $('restClock').textContent = pad(n.getHours()) + ':' + pad(n.getMinutes());
  $('restDate').textContent = DAYS[n.getDay()] + ' · ' + n.getDate() + ' ' + MONTHS[n.getMonth()] + ' ' + n.getFullYear();
  $('restTemp').textContent = $('mainTemp').textContent + '°';
  $('restCond').textContent = $('mainCond').textContent;

}
function exitRest(manual){

  document.querySelector('.screen').classList.remove('rest');
  if (manual) restSnoozeUntil = Date.now() + 10 * 60 * 1000;
  lastMoveAt = Date.now();

}
function trackMovement(lat, lon){

  if (fixSpeed > 1.5 || distKm(restRef.lat, restRef.lon, lat, lon) > 0.06){
    lastMoveAt = Date.now(); restRef = { lat, lon };

}
{

  ck.addEventListener('touchstart', () => {

let aheadLast = { t: 0, lat: null, lon: null }, aheadBusy = false, aheadShown = false;
function aheadPoint(lat, lon, bearing, km){
  const b = bearing * Math.PI / 180;
  return [lat + km * Math.cos(b) / 110.54, lon + km * Math.sin(b) / (111.32 * Math.max(0.2, Math.cos(lat * Math.PI / 180)))];
}
function hazardOf(c){
  const code = c.weather_code, temp = c.temperature_2m, gust = c.wind_gusts_10m || 0, pr = c.precipitation || 0;
  const wet = [51,53,55,61,63,65,80,81,82,71,73,75,77,85,86].includes(code);
  if ([95,96,99].includes(code)) return { sev: 5, txt: 'GÖK GÜRÜLTÜLÜ FIRTINA' };
  if ([56,57,66,67].includes(code) || (temp <= 3 && (pr > 0.1 || wet))) return { sev: 5, txt: 'BUZLANMA RİSKİ' };
  if ([71,73,75,77,85,86].includes(code)) return { sev: 4, txt: 'KAR YAĞIŞI' };
  if (gust >= 55) return { sev: 4, txt: 'SERT RÜZGÂR ' + Math.round(gust) + ' KM/SA' };
  if ([45,48].includes(code)) return { sev: 3, txt: 'SİS' };
  if ([65,82].includes(code)) return { sev: 3, txt: 'YOĞUN YAĞMUR' };
  if ([51,53,55,61,63,80,81].includes(code)) return { sev: 2, txt: 'YAĞMUR' };
  return null;
}
function showAhead(b){
  const chip = $('aheadChip');
  if (!b){ aheadShown = false; chip.classList.remove('on'); return; }
  $('aheadText').textContent = `${b.km} KM ÖNDE · ${b.txt}`;

async function checkAhead(){
  if (aheadBusy || manual || fixLat === null) return;
  const now = Date.now();
  if (fixSpeed < 5 || now - fixTime > 15000) return;
  const moved = aheadLast.lat !== null ? distKm(aheadLast.lat, aheadLast.lon, fixLat, fixLon) : 99;
  if (now - aheadLast.t < 8 * 60000 && moved < 12) return;
  aheadBusy = true; aheadLast = { t: now, lat: fixLat, lon: fixLon };
  try{
    const kms = [30, 60, 100];
    const pts = kms.map(k => aheadPoint(fixLat, fixLon, fixHead, k));
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${pts.map(p => p[0].toFixed(3)).join(',')}&longitude=${pts.map(p => p[1].toFixed(3)).join(',')}&current=temperature_2m,precipitation,weather_code,wind_gusts_10m&timezone=auto`;
    const d = await (await fetch(url)).json();
    const arr = Array.isArray(d) ? d : [d];
    let best = null;
    arr.forEach((o, i) => {
      const c = o && o.current; if (!c) return;
      const h = hazardOf(c);
      if (h && (!best || h.sev > best.sev || (h.sev === best.sev && kms[i] < best.km))) best = { sev: h.sev, txt: h.txt, km: kms[i] };
    });

  }catch{}
  finally{ aheadBusy = false; }
}

const KM_TH = 3, T_TH = 3*60*1000;

function distKm(a,b,c,d){
  const R=6371,r=Math.PI/180,dl=(c-a)*r,dn=(d-b)*r;

}

function cleanTrackTitle(raw, stationName){

async function readIcyTitle(url, signal){
  const res = await fetch(url, { headers: { 'Icy-MetaData': '1' }, signal });
  const metaint = parseInt(res.headers.get('icy-metaint'), 10);
  if (!metaint || isNaN(metaint) || !res.body) return "";
  const reader = res.body.getReader();
  let buf = new Uint8Array(0);
  while (true){
    const { value, done } = await reader.read();
    if (done || !value) break;
    const next = new Uint8Array(buf.length + value.length);
    next.set(buf); next.set(value, buf.length); buf = next;
    if (buf.length >= metaint + 1){
      const metaLen = buf[metaint] * 16;
      if (metaLen === 0) break;
      if (buf.length >= metaint + 1 + metaLen){
        const raw = new TextDecoder('utf-8').decode(buf.slice(metaint + 1, metaint + 1 + metaLen));
        const m = raw.match(/StreamTitle='(.*?)';/i) || raw.match(/StreamTitle='([^']*)'/i);
        return m ? m[1] : "";
      }
    }
    if (buf.length > metaint + 8192) break;
  }
  return "";
}
